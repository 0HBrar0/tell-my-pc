name: Feature or plugin idea
description: Suggest an improvement, or a notifier/transport/executor plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do from your phone that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: where
    attributes:
      label: Where should it live?
      options:
        - Core
        - A plugin (see docs/writing-a-plugin.md)
        - Not sure
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: Works without any server run by the maintainers
          required: true
        - label: Does not need Claude credentials or --dangerously-skip-permissions
          required: true
