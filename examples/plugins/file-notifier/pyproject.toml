[project]
name = "tell-my-pc-file-notifier"
version = "0.1.0"
description = "Sample tell-my-pc notifier plugin: appends every notification to a JSONL file."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."tell_my_pc.notifiers"]
file = "tmp_file_notifier:create"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmp_file_notifier"]
